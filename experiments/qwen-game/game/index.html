<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Riddle Moth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>The Riddle Moth</h1>
    <div id="moth">🦋</div>
    <p id="speech">Hello! I have a riddle for you.</p>
    <p id="score">Solved: 0</p>
    <input id="guess" type="text" />
    <button id="send">Guess</button>
    <button id="hint">Ask for a hint</button>
    <button id="next">New riddle</button>
    <script src="game.js"></script>
</body>
</html>
